            - generic [ref=e87]: 107 Tests · October 2026
        - article [ref=e88]:
          - 'heading "jobq: Distributed Job Queue" [level=3] [ref=e89]'
          - paragraph [ref=e90]: A job queue where a job is never lost and never runs twice by mistake, even when a worker crashes mid-task. Redis dispatches job IDs, PostgreSQL holds the record of every job and attempt, and idempotency keys make the effect happen once.
          - list [ref=e91]:
            - listitem [ref=e92]:
              - text: "Chaos test: 13 workers killed with"
              - code [ref=e93]: kill -9
              - text: during a 10,000-job run;
              - strong [ref=e94]: 10,000 succeeded, 0 lost, 0 run twice
            - listitem [ref=e95]: Atomic Lua leasing, heartbeats, a reaper and attempt-number fencing so a stale worker can't overwrite a newer result
            - listitem [ref=e96]:
              - text: Exponential backoff with full jitter, a replayable dead-letter queue, cron schedules and
              - code [ref=e97]: "429"
              - text: backpressure
            - listitem [ref=e98]: Prometheus and Grafana dashboards, k6 load tests, and 63 tests against real Postgres and Redis
          - generic [ref=e99]: Python, FastAPI, Redis, PostgreSQL, Prometheus, Grafana, k6
          - generic [ref=e100]:
            - link "View on GitHub →" [ref=e101] [cursor=pointer]:
              - /url: https://github.com/Rishavbhattarai/distributed-job-queue
            - generic [ref=e102]: Open Source · October 2026
        - article [ref=e103]:
          - 'heading "Tanks Arena: Real-Time Multiplayer Netcode" [level=3] [ref=e104]'
          - paragraph [ref=e105]: A browser tank arena built to study multiplayer networking. The server simulates at a fixed 30 ticks per second and is the only source of truth; clients predict their own tank, interpolate everyone else, and hits are lag-compensated. No game engine, so all the netcode is hand-written and tested.
          - list [ref=e106]:
            - listitem [ref=e107]:
              - text: Holds
              - strong [ref=e108]: 1,680 players
              - text: on one Node process within the 33 ms tick budget (p99 26.4 ms)
            - listitem [ref=e109]:
              - text: Delta snapshots cut downstream bandwidth per player by
              - strong [ref=e110]: 73%
              - text: ", from 24.30 to 6.64 KB/s"
            - listitem [ref=e111]: 0 prediction corrections at 150 ms RTT and 5% packet loss; a cheating client's teleports, input floods and replays are all rejected
            - listitem [ref=e112]: Reconnect within 30 s keeps the same tank, position and score; 96 tests
          - generic [ref=e113]: TypeScript, Node.js, WebSockets, Canvas, Vitest, Prometheus, Grafana
          - generic [ref=e114]:
            - link "View on GitHub →" [ref=e115] [cursor=pointer]:
