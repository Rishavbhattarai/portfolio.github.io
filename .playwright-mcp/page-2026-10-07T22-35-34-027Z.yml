      - generic [ref=e70]:
        - article [ref=e71]:
          - heading "Usage Metering & Billing Pipeline" [level=3] [ref=e72]
          - paragraph [ref=e73]: A pipeline that turns raw usage events, such as API calls or gigabytes stored, into monthly invoices and syncs customers and invoices to Salesforce. Raw events are never edited, so every invoice amount can be recomputed from the events that produced it.
          - list [ref=e74]:
            - listitem [ref=e75]:
              - text: Ingests 1,000,000 events with 10% duplicates at
              - strong [ref=e76]: 38,568 events/s
              - text: and stores exactly the 900,129 unique ones, via
              - code [ref=e77]: INSERT ... ON CONFLICT DO NOTHING
              - text: on a client-supplied event ID
            - listitem [ref=e78]: Replays the full log of 999,589 events twice into an empty database and rebuilds all 200 invoices with identical SHA-256 hashes
            - listitem [ref=e79]:
              - text: Pure rating engine (flat, graduated tiers, minimum commit) in
              - code [ref=e80]: Decimal
              - text: and integer cents, with Hypothesis property tests; late events become next-invoice adjustments priced at the old period's marginal rate
            - listitem [ref=e81]:
              - text: "Close, Salesforce sync and reconciliation run as jobs on jobq with retries and a DLQ. A live Developer Edition org matched the ledger to the cent:"
              - strong [ref=e82]: $598,167.89
              - text: ", zero drift"
          - generic [ref=e83]: Python, FastAPI, PostgreSQL, jobq, Salesforce Bulk API 2.0, HTMX, Hypothesis, Docker
          - generic [ref=e84]:
            - link "Read the Write-up →" [ref=e85] [cursor=pointer]:
