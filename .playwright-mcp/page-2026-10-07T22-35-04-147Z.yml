        - article [ref=f6e101]:
          - 'heading "AMR-Climate Atlas: Antimicrobial Resistance Research" [level=3] [ref=f6e102]'
          - paragraph [ref=f6e103]: Causal panel testing whether a hotter year makes antibiotic resistance worse across 29 EU/EEA countries. Four government data sources are joined into a 2000-2023 panel, with a mandatory 200-permutation placebo test gating every result.
          - list [ref=f6e104]:
            - listitem [ref=f6e105]: Two-way fixed-effects regression across four pathogen-antibiotic combinations, cross-checked against independent genomic resistance data via BigQuery
            - listitem [ref=f6e106]: Live MCP server (Anthropic's official SDK) exposing live weather and genomic-resistance data, plus an eval-gated CI pipeline that refits every model on push
            - listitem [ref=f6e107]: Caught and documented a confounder column silently absorbed into the model's fixed effects, a bug with no error message
            - listitem [ref=f6e108]: "Reported an honest mostly-null result: three of four combinations show nothing, the fourth a narrow, independently-corroborated exception"
          - generic [ref=f6e109]: Python, Streamlit, MCP SDK, BigQuery, Fixed-Effects Panel Regression
