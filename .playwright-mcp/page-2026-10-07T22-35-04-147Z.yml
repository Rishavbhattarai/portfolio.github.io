        - article [ref=f6e86]:
          - 'heading "PCVI Atlas: Heatwave Vulnerability Research" [level=3] [ref=f6e87]'
          - paragraph [ref=f6e88]: Public-health research pipeline testing whether U.S. communities with high prescriptions of heat-sensitizing medications face greater vulnerability during heatwaves, linking 8.79M Medicare Part D claims to summer heat exposure across Hospital Referral Regions.
          - list [ref=f6e89]:
            - listitem [ref=f6e90]: "Four-stage pipeline: drug crosswalk (276 medications resolved to RxCUI/ATC), claims processing, evidence weighting, and causal analysis"
            - listitem [ref=f6e91]: 6-year daily panel with conditional Poisson regression and 200-permutation placebo testing to separate correlation from causation
            - listitem [ref=f6e92]: Identified and corrected a prescriber-vs-patient-location denominator artifact by reattributing claims via hospital catchment areas
            - listitem [ref=f6e93]: Interactive Streamlit app for exploring results across NASA POWER, NOAA, and Census data sources
          - generic [ref=f6e94]: Python, Streamlit, Pandas, RxNorm/RxClass API, Dartmouth Atlas HRR
