            - 'heading "CytoGuard: Cellular Injury Detection in Cell Painting Screens" [level=3] [ref=e91]'
            - paragraph [ref=e92]: An open platform that flags injured wells in Cell Painting drug screens, names the likely injury mechanism, and shows the cells behind every call. Evaluated on 16,701 wells from IDR idr0133, with every compound scored by a model that never saw it.
            - list [ref=e93]:
              - listitem [ref=e94]: › Macro-F1 of 0.462 on never-seen compounds, against 0.146 for the published Pycytominer baseline; AUROC 0.947 for injured vs healthy wells
              - listitem [ref=e95]: › Raw images to injury calls with OME-Zarr, Cellpose-SAM and cp_measure; pixel-level scores match the published profiles at r = 0.95
              - listitem [ref=e96]: › FastAPI job queue, plugin system and a web viewer with segmentation overlays; 20 tests and a one-command Snakemake workflow
